name: Render Video

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp
      - run: python cloud_worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: render_temp/queue_video.mp4
          retention-days: 1
